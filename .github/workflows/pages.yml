name: Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A closed PR only needs its preview removed, so skip the build.
      - uses: pnpm/action-setup@v6
        if: github.event.action != 'closed'
      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event.action != 'closed'

      - name: Check
        if: github.event.action != 'closed'
        run: pnpm lint && pnpm format:check && pnpm test

      # Regenerates districts, validates the data, type-checks and bundles into dist/.
      - name: Build
        if: github.event.action != 'closed'
        run: pnpm build

      - name: Deploy main
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

      # Pull requests from forks get a read-only token, so they can't push a preview to gh-pages.
      # They still run the checks and the build above; only the preview is skipped.
      - name: Deploy PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
