name: Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Commits must carry a real author: a placeholder identity (an email ending in .local, or a
      # name like "Sync Bot") isn't a person who signed the CLA, and would land in main's history
      # as a co-author. GitHub's own [bot] accounts (Dependabot) are fine.
      - name: Commit authors
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bad=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --paginate \
            --jq '.[] | select((.commit.author.email | endswith(".local")) or ((.commit.author.name | test("\\bbot\\b"; "i")) and (.commit.author.name | endswith("[bot]") | not))) | "\(.sha[0:8]) \(.commit.author.name) <\(.commit.author.email)>"')
          if [ -n "$bad" ]; then
            echo "::error::These commits have a placeholder author. Recommit them as yourself (git commit --amend --reset-author):"
            echo "$bad"
            exit 1
          fi

      - uses: actions/checkout@v7

      # A closed PR only needs its preview removed, so skip the build.
      - uses: pnpm/action-setup@v6
        if: github.event.action != 'closed'
      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event.action != 'closed'

      - name: Check
        if: github.event.action != 'closed'
        run: pnpm lint && pnpm format:check && pnpm test

      # Regenerates districts, validates the data, type-checks and bundles into dist/.
      - name: Build
        if: github.event.action != 'closed'
        run: pnpm build

      # Smoke tests in a real browser against the built site (e2e/), desktop and phone sizes.
      - name: Browser tests
        if: github.event.action != 'closed'
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e

      - name: Deploy main
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

      # Push changed Map:GTA VI pages and the map image to gta.wiki (scripts/sync-wiki.ts).
      # Skips itself until the WIKI_BOT_USER / WIKI_BOT_PASSWORD secrets exist.
      - name: Sync gta.wiki maps
        if: github.event_name == 'push'
        run: pnpm sync:wiki
        env:
          WIKI_BOT_USER: ${{ secrets.WIKI_BOT_USER }}
          WIKI_BOT_PASSWORD: ${{ secrets.WIKI_BOT_PASSWORD }}

      # GitHub only reads .nojekyll at the site root (deployed from main). The preview action
      # removes a closed PR's folder but skips dotfiles, so a copy here would be left behind.
      - name: Drop .nojekyll from the preview
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        run: rm -f dist/.nojekyll

      # Pull requests from forks get a read-only token, so they can't push a preview to gh-pages.
      # They still run the checks and the build above; only the preview is skipped.
      - name: Deploy PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
