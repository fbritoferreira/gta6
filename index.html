<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open GTA 6 Map</title>
    <meta
      name="description"
      content="Open-source interactive map of Leonida from GTA 6: over 3,000 collectibles, activities and places, matched to their real Florida spots. Free data you can embed."
    />
    <meta name="theme-color" content="#0F1D30" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Link previews on X, Reddit, Discord, Slack. URLs must be absolute; the build fills in %SITE_URL%. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open GTA 6 Map" />
    <meta property="og:title" content="Leonida: the open GTA 6 map" />
    <meta
      property="og:description"
      content="Over 3,000 collectibles, activities and places on day and night maps, with search and a found tracker. Free, open data."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Leonida map over Vice City at night, with category pins and the filter panel"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%23FF5FA2'/><circle cx='50' cy='50' r='18' fill='%23fff'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Monoton&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
